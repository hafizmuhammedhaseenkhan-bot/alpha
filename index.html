<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Jarvis UI</title>
    <style>
        body {
            background-color: #050b14;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .arc-reactor {
            width: 200px;
            height: 200px;
            border: 5px solid #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 30px #00ffff, inset 0 0 30px #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            margin-bottom: 30px;
        }
        .inner-core {
            width: 100px;
            height: 100px;
            border: 3px dashed #ffffff;
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff; }
            50% { box-shadow: 0 0 40px #00ffff, inset 0 0 40px #00ffff; }
            100% { box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff; }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffff;
            transition: 0.3s;
            border-radius: 5px;
        }
        button:hover {
            background: #00ffff;
            color: #050b14;
            box-shadow: 0 0 20px #00ffff;
        }
        #response-text {
            margin-top: 25px;
            font-size: 22px;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="arc-reactor">
            <div class="inner-core"></div>
        </div>
        <button id="start-btn">JARVIS को सक्रिय करें</button>
        <p id="response-text">सिस्टम ऑनलाइन है। आदेश दें...</p>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const responseText = document.getElementById('response-text');

        const recognition = new webkitSpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.continuous = false;

        const speak = (text) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
            responseText.innerText = text;
        };

        startBtn.addEventListener('click', () => {
            recognition.start();
            speak("सुन रहा हूँ सर...");
        });

        recognition.onresult = (event) => {
            const command = event.results[0][0].transcript.toLowerCase();
            console.log("Command: " + command);

            if (command.includes('youtube खोलो') || command.includes('youtube')) {
                speak('यूट्यूब खोल रहा हूँ।');
                window.open('https://www.youtube.com', '_blank');
            } else if (command.includes('google') || command.includes('गूगल')) {
                speak('गूगल सर्च ओपन कर रहा हूँ।');
                window.open('https://www.google.com', '_blank');
            } else if (command.includes('तुम्हारा नाम क्या है')) {
                speak('मेरा नाम जार्विस है, आपका एडवांस डिजिटल असिस्टेंट।');
            } else if (command.includes('आज की तारीख')) {
                const date = new Date().toLocaleDateString('hi-IN');
                speak('आज की तारीख है ' + date);
            } else if (command.includes('समय क्या है') || command.includes('समय')) {
                const time = new Date().toLocaleTimeString('hi-IN');
                speak('अभी समय हुआ है ' + time);
            } else {
                speak('माफ़ करें, मैं इस कमांड को समझ नहीं पाया।');
            }
        };

        recognition.onerror = () => {
            speak('कुछ तकनीकी समस्या आई है, कृपया पुनः प्रयास करें।');
        };
    </script>
</body>
</html>
