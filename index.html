<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI Assistant</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(circle at center, #123456 0%, #06111f 45%, #020711 100%);
  color: white; font-family: "Segoe UI", Arial, sans-serif;
  height: 100vh; overflow: hidden;
  display: flex; justify-content: center; align-items: center;
}
.container {
  width: 92%; max-width: 600px; text-align: center; padding: 45px 30px;
  border-radius: 25px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(0,210,255,0.25);
  box-shadow: 0 0 50px rgba(0,180,255,0.15); backdrop-filter: blur(15px);
}
h1 { font-size: 42px; color: #00d9ff; letter-spacing: 5px; text-shadow: 0 0 20px #00d9ff; margin-bottom: 10px; }
.subtitle { color: #8da9bd; margin-bottom: 25px; }
.orb {
  width: 150px; height: 150px; margin: 25px auto; border-radius: 50%;
  border: 3px solid #00d9ff;
  box-shadow: 0 0 20px #00d9ff, 0 0 50px rgba(0,217,255,0.5), inset 0 0 30px rgba(0,217,255,0.3);
  display: flex; justify-content: center; align-items: center; font-size: 55px; transition: 0.3s;
}
.orb.listening { animation: pulse 1.2s infinite; }
@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 20px #00d9ff; }
  50% { transform: scale(1.08); box-shadow: 0 0 60px #00d9ff; }
  100% { transform: scale(1); box-shadow: 0 0 20px #00d9ff; }
}
#status { min-height: 50px; color: #d5e9f5; font-size: 18px; margin: 20px 0 10px; }
#heard { min-height: 30px; color: #55dfff; font-size: 15px; margin-bottom: 10px; }
#link { min-height: 30px; margin-bottom: 15px; }
#link a {
  display: inline-block; padding: 10px 22px; border-radius: 30px;
  background: #00d9ff; color: #02131f; font-weight: bold; text-decoration: none;
}
button {
  border: none; border-radius: 50px; padding: 14px 35px;
  background: linear-gradient(135deg, #00d9ff, #0077ff); color: white;
  font-size: 17px; font-weight: bold; cursor: pointer;
  box-shadow: 0 0 20px rgba(0,180,255,0.4);
}
button:hover { transform: scale(1.04); }
.online { color: #4cff9b !important; }
.error { color: #ff7777 !important; }
</style>
</head>
<body>

<div class="container">
  <h1>JARVIS</h1>
  <div class="subtitle">AI VOICE ASSISTANT</div>
  <div id="orb" class="orb">🤖</div>
  <div id="status">Start Jarvis दबाइए।</div>
  <div id="heard"></div>
  <div id="link"></div>
  <button id="startBtn" onclick="startJarvis()">START JARVIS</button>
</div>

<script>
let recognition = null;
let jarvisRunning = false;
let speaking = false;
let listening = false;
let restartTimer = null;
let speakId = 0;
let voices = [];

const statusText = document.getElementById("status");
const heardText = document.getElementById("heard");
const linkBox = document.getElementById("link");
const startButton = document.getElementById("startBtn");
const orb = document.getElementById("orb");

function setStatus(text, type = "") {
  statusText.innerText = text;
  statusText.className = type;
}

function loadVoices() { voices = window.speechSynthesis.getVoices(); }
if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function scheduleListen(ms) {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(startListening, ms);
}

function startListening() {
  if (!jarvisRunning || speaking || listening || !recognition) return;
  try { recognition.start(); } catch (e) {}
}

function speak(text) {
  if (!("speechSynthesis" in window)) { speaking = false; scheduleListen(500); return; }

  speaking = true;
  clearTimeout(restartTimer);
  try { recognition && recognition.abort(); } catch (e) {}
  window.speechSynthesis.cancel();

  const id = ++speakId;
  const utter = new SpeechSynthesisUtterance(text);
  const hindi = voices.find(v => v.lang.toLowerCase().startsWith("hi"));
  if (hindi) { utter.voice = hindi; utter.lang = hindi.lang; }
  else { utter.lang = "en-US"; }
  utter.rate = 0.95;
  utter.pitch = 1.0;
  utter.volume = 1.0;

  let finished = false;
  const done = function() {
    if (finished || id !== speakId) return;
    finished = true;
    speaking = false;
    scheduleListen(600);
  };
  utter.onend = done;
  utter.onerror = done;
  setTimeout(done, 6000 + text.length * 120);

  setTimeout(function() { window.speechSynthesis.speak(utter); }, 100);
}

function startJarvis() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus("Speech Recognition उपलब्ध नहीं है। Chrome इस्तेमाल करें।", "error");
    return;
  }
  if (jarvisRunning) return;

  jarvisRunning = true;
  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    listening = true;
    orb.classList.add("listening");
    setStatus("JARVIS सुन रहा है... बोलिए!", "online");
  };

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript.toLowerCase().trim();
    heardText.innerText = "आपने कहा: " + transcript;
    linkBox.innerHTML = "";
    orb.classList.remove("listening");
    processCommand(transcript);
  };

  recognition.onerror = function(event) {
    console.log("Speech error:", event.error);
    listening = false;
    orb.classList.remove("listening");

    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      setStatus("Microphone permission बंद है। Chrome में microphone Allow करें।", "error");
      jarvisRunning = false;
      startButton.style.display = "inline-block";
    }
  };

  recognition.onend = function() {
    listening = false;
    orb.classList.remove("listening");
    if (jarvisRunning && !speaking) scheduleListen(500);
  };

  startButton.style.display = "none";
  setStatus("JARVIS शुरू हो रहा है...", "online");
  speak("Jarvis online है, बोलिए boss, मैं सुन रहा हूँ।");
}

function showLink(url) {
  linkBox.innerHTML = '<a href="' + url + '" target="_blank">यहाँ क्लिक करके खोलें</a>';
}

function openLater(url) {
  setTimeout(function() {
    const w = window.open(url, "_blank");
    if (!w) {
      showLink(url);
      setStatus("Pop-up रुक गया। नीचे बटन दबाइए, या address bar में Always allow करें।", "error");
    }
  }, 800);
}

const COMMANDS = [
  { keys: ["hello", "हेलो", "हैलो", "hi jarvis", "हाय jarvis"],
    reply: "Hello boss, Jarvis आपकी मदद के लिए तैयार है।" },
  { keys: ["jarvis open", "जार्विस खोलो", "जार्विस ऑनलाइन"],
    reply: "Yes boss, Jarvis online है।" },
  { keys: ["तुम्हारा नाम", "your name", "who are you", "तुम कौन हो"],
    reply: "मेरा नाम Jarvis है। मैं आपका personal AI voice assistant हूँ।" },
  { keys: ["किसने बनाया", "who made you", "who created you"],
    reply: "मुझे मेरे boss ने बनाया है।" },
  { keys: ["कैसे हो", "कैसा है", "how are you"],
    reply: "मैं बिल्कुल ठीक हूँ boss। और आपकी मदद के लिए तैयार हूँ।" },
  { keys: ["thank you", "धन्यवाद", "शुक्रिया"],
    reply: "You're welcome boss." },
  { keys: ["whatsapp", "व्हाट्सएप", "व्हाट्सअप"],
    reply: "WhatsApp खोला जा रहा है।", url: "https://web.whatsapp.com" },
  { keys: ["facebook", "फेसबुक"],
    reply: "Facebook खोला जा रहा है।", url: "https://www.facebook.com" },
  { keys: ["instagram", "इंस्टाग्राम"],
    reply: "Instagram खोला जा रहा है।", url: "https://www.instagram.com" },
  { keys: ["gmail", "जीमेल", "ईमेल", "email"],
    reply: "Gmail खोला जा रहा है।", url: "https://mail.google.com" },
  { keys: ["map", "मैप", "नक्शा"],
    reply: "Google Maps खोला जा रहा है।", url: "https://maps.google.com" },
  { keys: ["मौसम", "weather"],
    reply: "मौसम की जानकारी खोल रहा हूँ।", url: "https://www.google.com/search?q=weather" },
  { keys: ["youtube", "यूट्यूब"],
    reply: "YouTube खोला जा रहा है boss।", url: "https://www.youtube.com" },
  { keys: ["google", "गूगल"],
    reply: "Google खोला जा रहा है boss।", url: "https://www.google.com" }
];

const JOKES = [
  "टीचर ने पूछा, सबसे तेज़ चीज़ क्या है? बच्चा बोला, छुट्टी की घंटी।",
  "मरीज़ ने डॉक्टर से कहा, मुझे भूलने की बीमारी है। डॉक्टर ने पूछा, कब से? मरीज़ बोला, किससे?",
  "पापा ने कहा, बेटा मोबाइल रख दो। बेटा बोला, पापा आप भी तो रिमोट नहीं छोड़ते।"
];

function has(command, keys) {
  return keys.some(k => command.includes(k));
}

function processCommand(command) {

  if (has(command, ["बंद करो", "बंद हो जाओ", "stop jarvis", "exit"])) {
    jarvisRunning = false;
    speak("ठीक है boss, Jarvis बंद हो रहा है।");
    setStatus("Jarvis बंद है। फिर से START दबाइए।");
    startButton.style.display = "inline-block";
    return;
  }

  if (has(command, ["जोक", "चुटकुला", "joke"])) {
    speak(JOKES[Math.floor(Math.random() * JOKES.length)]);
    return;
  }

  if (command.startsWith("search ") || command.startsWith("सर्च ")) {
    const query = command.replace("search ", "").replace("सर्च ", "").trim();
    if (query.length > 0) {
      speak(query + " को Google पर खोज रहा हूँ।");
      openLater("https://www.google.com/search?q=" + encodeURIComponent(query));
      return;
    }
  }

  if (has(command, ["चलाओ", "बजाओ", "चला दो", "play "])) {
    let q = command
      .replace(/youtube|यूट्यूब|खोलो|खोल|और|उसमें|इसमें|चलाओ|चला दो|बजाओ|play|on|पर|वीडियो/g, " ")
      .replace(/\s+/g, " ").trim();
    if (!q) q = command;
    speak(q + " को YouTube पर खोज रहा हूँ।");
    openLater("https://www.youtube.com/results?search_query=" + encodeURIComponent(q));
    return;
  }

  for (const c of COMMANDS) {
    if (has(command, c.keys)) {
      speak(c.reply);
      if (c.url) openLater(c.url);
      return;
    }
  }

  if (has(command, ["समय", "टाइम", "time"])) {
    const t = new Date().toLocaleTimeString("hi-IN", { hour: "2-digit", minute: "2-digit" });
    speak("अभी समय है " + t);
    return;
  }

  if (has(command, ["आज की तारीख", "आज की डेट", "date"])) {
    const d = new Date().toLocaleDateString("hi-IN", { day: "numeric", month: "long", year: "numeric" });
    speak("आज की तारीख है " + d);
    return;
  }

  if (command.split(" ").length >= 2) {
    speak(command + " को Google पर खोज रहा हूँ।");
    openLater("https://www.google.com/search?q=" + encodeURIComponent(command));
  } else {
    speak("Boss, मैं समझ नहीं पाया। फिर से बोलिए।");
  }
}
</script>

</body>
</html>
