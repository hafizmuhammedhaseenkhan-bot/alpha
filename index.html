
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI</title>
    <style>
        body {
            background-color: #01172a;
            color: #50aefc;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>

    <h1>Jarvis Voice Assistant</h1>
    <p id="status">बोलिए, जार्विस सुन रहा है...</p>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("आपका ब्राउज़र वॉइस रिकॉग्निशन सपोर्ट नहीं करता। गूगल क्रोम का इस्तेमाल करें।");
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'hi-IN';

            // आवाज़ से जवाब देने वाला फंक्शन
            function speak(text) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            }

            // वॉइस कमांड संभालने का फंक्शन
            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                console.log("आपने कहा:", transcript);

                // 'जार्विस' या 'jarvis' बोलने पर कमांड चालू होगी
                if (transcript.includes('जार्विस') || transcript.includes('jarvis')) {
                    
                    if (transcript.includes('यूट्यूब') || transcript.includes('youtube')) {
                        speak("यूट्यूब खोल रहा हूँ");
                        window.open("https://www.youtube.com", "_blank");
                    } 
                    else if (transcript.includes('गूगल') || transcript.includes('google')) {
                        speak("गूगल खोल रहा हूँ");
                        window.open("https://www.google.com", "_blank");
                    } 
                    else if (transcript.includes('गाना') || transcript.includes('song')) {
                        speak("गाना चला रहा हूँ");
                        window.open("https://www.youtube.com/results?search_query=songs", "_blank");
                    } 
                    else {
                        speak("जी हुकुम, बताइए क्या करना है?");
                    }
                }
            };

            // बंद होने पर खुद दोबारा शुरू हो जाए
            recognition.onend = () => {
                recognition.start();
            };

            recognition.start();
        }
    </script>

</body>
</html>
