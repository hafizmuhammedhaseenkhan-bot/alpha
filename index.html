<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Voice Assistant</title>
    <style>
        body {
            background-color: #05172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>

    <h1>Jarvis Voice Assistant</h1>
    <p id="status">जार्विस सुन रहा है...</p>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("आपका ब्राउज़र स्पीच रिकग्निशन सपोर्ट नहीं करता। कृपया Google Chrome का उपयोग करें।");
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'hi-IN'; // हिंदी भाषा के लिए

            recognition.onstart = function() {
                document.getElementById("status").innerText = "जार्विस सुन रहा है... बोलिए!";
            };

            recognition.onresult = function(event) {
                const current = event.resultIndex;
                const transcript = event.results[current][0].transcript.toLowerCase();
                
                document.getElementById("status").innerText = "आपने कहा: " + transcript;
                
                // यहाँ आप जार्विस के जवाब देने का कोड सेट कर सकते हैं
                speak("आपने कहा: " + transcript);
            };

            recognition.onerror = function(event) {
                console.error("خطا:", event.error);
            };

            recognition.onend = function() {
                // यह सुनिश्चित करता है कि जार्विस लगातार सुनता रहे बंद न हो
                recognition.start();
            };

            // जार्विस को बोलने के लिए फंक्शन
            function speak(text) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            }

            // ऑटोमैटिक सुनना शुरू करें
            recognition.start();
        }
    </script>

</body>
</html>
