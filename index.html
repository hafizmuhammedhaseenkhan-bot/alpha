<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS Smart AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at center,
                #123d5c 0%,
                #061522 45%,
                #01060b 100%);

            color: white;
            font-family: Arial, sans-serif;
        }

        .jarvis {
            width: 90%;
            max-width: 750px;

            padding: 40px 25px;

            text-align: center;

            background: rgba(0, 15, 30, 0.88);

            border: 1px solid #00d9ff;
            border-radius: 25px;

            box-shadow:
                0 0 30px rgba(0, 217, 255, 0.25),
                inset 0 0 30px rgba(0, 217, 255, 0.05);
        }

        h1 {
            margin: 10px 0;

            font-size: 45px;

            color: #00d9ff;

            text-shadow:
                0 0 15px #00d9ff;
        }

        .orb {
            width: 140px;
            height: 140px;

            margin: 0 auto 25px;

            border-radius: 50%;

            border: 3px solid #00d9ff;

            box-shadow:
                0 0 20px #00d9ff,
                0 0 60px rgba(0, 217, 255, 0.5);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        #status {
            min-height: 30px;

            margin-top: 20px;

            color: #00d9ff;

            font-size: 20px;
        }

        #heard {
            min-height: 30px;

            color: #dddddd;

            font-size: 18px;

            margin: 20px;
        }

        button {
            padding: 14px 25px;

            margin: 8px;

            border: none;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background: #00d9ff;

            color: #001018;

            box-shadow:
                0 0 15px rgba(0, 217, 255, 0.3);
        }

        button:hover {
            background: #6eeeff;
        }

        #stopBtn {
            background: #ff4d4d;
            color: white;
        }
    </style>
</head>


<body>

<div class="jarvis">

    <div class="orb"></div>

    <h1>JARVIS</h1>

    <p id="status">
        Jarvis शुरू करने के लिए Start दबाएँ।
    </p>

    <p id="heard">
        आपने अभी कुछ नहीं कहा।
    </p>

    <button id="startBtn" onclick="startJarvis()">
        🎙️ Start Jarvis
    </button>

    <button id="stopBtn" onclick="stopJarvis()">
        ⛔ Stop
    </button>

    <button onclick="testVoice()">
        🔊 Test Voice
    </button>

</div>


<script>

    // =========================================
    // GLOBAL VARIABLES
    // =========================================

    let recognition = null;

    let isListening = false;

    let isSpeaking = false;

    let restarting = false;

    let lastCommand = "";

    let lastCommandTime = 0;


    const statusText =
        document.getElementById("status");

    const heardText =
        document.getElementById("heard");


    // =========================================
    // SPEAK FUNCTION
    // =========================================

    function speak(text) {

        if (!text) return;

        isSpeaking = true;

        window.speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "hi-IN";

        speech.rate = 0.95;

        speech.pitch = 1;

        speech.volume = 1;


        speech.onstart = function () {

            statusText.innerText =
                "🔊 Jarvis बोल रहा है...";
        };


        speech.onend = function () {

            isSpeaking = false;

            if (isListening) {

                statusText.innerText =
                    "🎙️ Jarvis सुन रहा है...";
            }
        };


        speech.onerror = function (event) {

            console.log(
                "Speech error:",
                event.error
            );

            isSpeaking = false;

            statusText.innerText =
                "⚠️ Voice output में समस्या।";
        };


        window.speechSynthesis.speak(speech);
    }


    // =========================================
    // TEST VOICE
    // =========================================

    function testVoice() {

        speak(
            "Hello Boss. Jarvis की आवाज़ ठीक से काम कर रही है।"
        );
    }


    // =========================================
    // START JARVIS
    // =========================================

    function startJarvis() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "Speech Recognition उपलब्ध नहीं है। Google Chrome इस्तेमाल करें।"
            );

            return;
        }


        if (isListening) {

            return;
        }


        recognition =
            new SpeechRecognition();


        recognition.continuous =
            true;


        recognition.interimResults =
            false;


        recognition.lang =
            "hi-IN";


        // =====================================
        // RECOGNITION START
        // =====================================

        recognition.onstart =
            function () {

                isListening = true;

                statusText.innerText =
                    "🎙️ Jarvis सुन रहा है...";

                document
                    .getElementById("startBtn")
                    .style.display =
                    "none";


                speak(
                    "Jarvis online है Boss। बोलिए।"
                );
            };


        // =====================================
        // VOICE RESULT
        // =====================================

        recognition.onresult =
            function (event) {

                const result =
                    event.results[
                        event.results.length - 1
                    ][0].transcript;


                const command =
                    result
                        .toLowerCase()
                        .trim();


                if (!command) {

                    return;
                }


                heardText.innerText =
                    "आपने कहा: " + result;


                // =================================
                // DUPLICATE COMMAND PROTECTION
                // =================================

                const now =
                    Date.now();


                if (
                    command === lastCommand &&
                    now - lastCommandTime < 3000
                ) {

                    console.log(
                        "Duplicate command ignored:",
                        command
                    );

                    return;
                }


                lastCommand =
                    command;


                lastCommandTime =
                    now;


                handleCommand(command);
            };


        // =====================================
        // RECOGNITION ERROR
        // =====================================

        recognition.onerror =
            function (event) {

                console.log(
                    "Recognition error:",
                    event.error
                );


                if (
                    event.error ===
                    "not-allowed"
                ) {

                    isListening = false;

                    statusText.innerText =
                        "❌ Microphone permission बंद है।";

                    alert(
                        "Chrome में Microphone को Allow करें।"
                    );

                    return;
                }


                if (
                    event.error ===
                    "no-speech"
                ) {

                    statusText.innerText =
                        "🎙️ Jarvis सुन रहा है...";

                    return;
                }


                statusText.innerText =
                    "⚠️ Mic error: " +
                    event.error;
            };


        // =====================================
        // AUTO RESTART
        // =====================================

        recognition.onend =
            function () {

                if (
                    isListening &&
                    !restarting
                ) {

                    restarting =
                        true;


                    setTimeout(
                        function () {

                            restarting =
                                false;


                            try {

                                recognition.start();

                            }
                            catch (error) {

                                console.log(
                                    error
                                );
                            }

                        },
                        700
                    );
                }
            };


        try {

            recognition.start();

        }
        catch (error) {

            console.log(error);

            statusText.innerText =
                "❌ Jarvis शुरू नहीं हो पाया।";
        }
    }


    // =========================================
    // STOP JARVIS
    // =========================================

    function stopJarvis() {

        isListening = false;

        restarting = false;

        isSpeaking = false;


        if (recognition) {

            try {

                recognition.stop();

            }
            catch (error) {

                console.log(error);
            }
        }


        window.speechSynthesis.cancel();


        statusText.innerText =
            "⛔ Jarvis बंद है।";


        document
            .getElementById("startBtn")
            .style.display =
            "inline-block";
    }


    // =========================================
    // COMMAND HANDLER
    // =========================================

    function handleCommand(command) {


        console.log(
            "Jarvis command:",
            command
        );


        // =====================================
        // HELLO
        // =====================================

        if (
            command.includes("hello") ||
            command.includes("हेलो") ||
            command.includes("हैलो")
        ) {

            speak(
                "Hello Boss. बताइए।"
            );

            return;
        }


        // =====================================
        // HOW ARE YOU
        // =====================================

        if (
            command.includes("कैसे हो") ||
            command.includes("how are you")
        ) {

            speak(
                "मैं बिल्कुल ठीक हूँ Boss।"
            );

            return;
        }


        // =====================================
        // NAME
        // =====================================

        if (
            command.includes("तुम्हारा नाम") ||
            command.includes("your name")
        ) {

            speak(
                "मेरा नाम Jarvis है। मैं आपका personal voice assistant हूँ।"
            );

            return;
        }


        // =====================================
        // TIME
        // =====================================

        if (
            command.includes("समय") ||
            command.includes("टाइम") ||
            command.includes("time")
        ) {

            const now =
                new Date();


            const time =
                now.toLocaleTimeString(
                    "en-IN",
                    {
                        hour: "numeric",
                        minute: "2-digit"
                    }
                );


            speak(
                "अभी समय है " +
                time
            );

            return;
        }


        // =====================================
        // DATE
        // =====================================

        if (
            command.includes("तारीख") ||
            command.includes("date")
        ) {

            const now =
                new Date();


            const date =
                now.toLocaleDateString(
                    "en-IN",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );


            speak(
                "आज की तारीख है " +
                date
            );

            return;
        }


        // =====================================
        // OPEN GOOGLE
        // =====================================

        if (
            command.includes("google खोलो") ||
            command.includes("google kholo") ||
            command.includes("open google")
        ) {

            speak(
                "Google खोल रहा हूँ।"
            );


            window.open(
                "https://www.google.com",
                "_blank"
            );


            return;
        }


        // =====================================
        // OPEN YOUTUBE
        // =====================================

        if (
            command.includes("youtube खोलो") ||
            command.includes("youtube kholo") ||
            command.includes("open youtube")
        ) {

            speak(
                "YouTube खोल रहा हूँ।"
            );


            window.open(
                "https://www.youtube.com",
                "_blank"
            );


            return;
        }


        // =====================================
        // GOOGLE SEARCH
        // =====================================

        if (
            command.startsWith("search ") ||
            command.startsWith("सर्च ")
        ) {

            let searchText =
                command
                    .replace("search ", "")
                    .replace("सर्च ", "")
                    .trim();


            if (
                searchText.length > 0
            ) {

                speak(
                    "Google पर खोज रहा हूँ।"
                );


                window.open(
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(
                        searchText
                    ),
                    "_blank"
                );


                return;
            }
        }


        // =====================================
        // JARVIS STOP
        // =====================================

        if (
            command.includes("jarvis बंद") ||
            command.includes("jarvis stop") ||
            command.includes("stop jarvis")
        ) {

            speak(
                "ठीक है Boss। Jarvis बंद हो रहा है।"
            );


            setTimeout(
                function () {

                    stopJarvis();

                },
                1200
            );


            return;
        }


        // =====================================
        // UNKNOWN COMMAND
        // =====================================
        // IMPORTANT:
        // Jarvis अब unknown command पर
        // बार-बार आवाज़ में नहीं बोलेगा।

        statusText.innerText =
            "🤔 Command समझ नहीं आई।";

        console.log(
            "Unknown command:",
            command
        );
    }

</script>

</body>
</html>
