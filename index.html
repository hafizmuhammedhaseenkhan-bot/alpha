<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Smart Voice Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #123b5d, #020912);
            color: white;
            font-family: Arial, sans-serif;
        }

        .jarvis {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 25px;
            border: 1px solid #00d9ff;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 217, 255, 0.25);
            background: rgba(0, 20, 35, 0.85);
        }

        h1 {
            color: #00d9ff;
            font-size: 42px;
            margin-bottom: 10px;
        }

        #status {
            color: #00d9ff;
            font-size: 20px;
            margin: 20px 0;
        }

        #heard {
            min-height: 30px;
            color: #ddd;
            font-size: 18px;
            margin: 15px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 25px;
            margin: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #00d9ff;
            color: #02101a;
        }

        button:hover {
            background: #65eaff;
        }

        #stopBtn {
            background: #ff5252;
            color: white;
        }

        .orb {
            width: 130px;
            height: 130px;
            margin: 20px auto;
            border-radius: 50%;
            border: 3px solid #00d9ff;
            box-shadow:
                0 0 20px #00d9ff,
                0 0 50px rgba(0, 217, 255, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="jarvis">

    <div class="orb"></div>

    <h1>JARVIS</h1>

    <p id="status">
        Jarvis शुरू करने के लिए Start दबाएँ।
    </p>

    <p id="heard">
        आपने अभी कुछ नहीं कहा।
    </p>

    <button id="startBtn" onclick="startJarvis()">
        🎙️ Start Jarvis
    </button>

    <button id="stopBtn" onclick="stopJarvis()">
        ⛔ Stop
    </button>

    <button onclick="testVoice()">
        🔊 Test Voice
    </button>

</div>


<script>

    let recognition;
    let isListening = false;
    let restarting = false;

    const statusText = document.getElementById("status");
    const heardText = document.getElementById("heard");


    // =========================
    // JARVIS SPEAK
    // =========================

    function speak(text) {

        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "hi-IN";
        speech.rate = 0.95;
        speech.pitch = 1;
        speech.volume = 1;

        speech.onstart = function () {
            statusText.innerText = "🔊 Jarvis बोल रहा है...";
        };

        speech.onend = function () {
            if (isListening) {
                statusText.innerText = "🎙️ Jarvis सुन रहा है...";
            }
        };

        speech.onerror = function (event) {
            console.log("Speech error:", event);
            statusText.innerText = "⚠️ Voice में समस्या हुई।";
        };

        window.speechSynthesis.speak(speech);
    }
