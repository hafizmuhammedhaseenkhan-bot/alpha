<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI</title>
    <style>
        body {
            background-color: #0f172a;
            color: #38bdf8;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20%;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0369a1;
        }
        #output {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>JARVIS AI ASSISTANT</h1>
    <button onclick="startListening()">Speak Command</button>
    <div id="output">बटन दबाएं और बोलें...</div>

    <script>
        const output = document.getElementById('output');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';

            function startListening() {
                output.innerText = "सुन रहा हूँ...";
                recognition.start();
            }

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                output.innerText = "आपने कहा: " + transcript;
                respond(transcript);
            };

            function respond(text) {
                let reply = "मुझे समझ नहीं आया";
                if (text.includes("हेलो") || text.includes("नमस्ते")) {
                    reply = "हेलो! मैं जार्विस हूँ, बताइए मैं क्या मदद करूँ?";
                } else if (text.includes("कैसे हो")) {
                    reply = "मैं बढ़िया हूँ! आप कैसे हैं?";
                }

                const synth = window.speechSynthesis;
                const utterance = new SpeechSynthesisUtterance(reply);
                utterance.lang = 'hi-IN';
                synth.speak(utterance);
            }
        } else {
            output.innerText = "आपका ब्राउज़र स्पीच रिकग्निशन सपोर्ट नहीं करता।";
        }
    </script>

</body>
</html>
