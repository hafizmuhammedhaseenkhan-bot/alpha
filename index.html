<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Voice Assistant</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #00eaff;
    }

    #status {
      font-size: 20px;
      margin: 25px 0;
      min-height: 30px;
    }

    button {
      padding: 14px 22px;
      margin: 6px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      background: #00eaff;
      color: black;
    }

    button:hover {
      opacity: 0.8;
    }

    #orb {
      width: 130px;
      height: 130px;
      margin: 30px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #00eaff, #0055ff, #00101a);
      box-shadow: 0 0 40px #00eaff;
    }

    .listening {
      animation: pulse 1.2s infinite;
    }
