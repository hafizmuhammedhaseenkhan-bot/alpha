<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Smart Voice Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #123b5d, #020912);
            color: white;
            font-family: Arial, sans-serif;
        }

        .jarvis {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 25px;
            border: 1px solid #00d9ff;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 217, 255, 0.25);
            background: rgba(0, 20, 35, 0.85);
        }

        h1 {
            color: #00d9ff;
            font-size: 42px;
            margin-bottom: 10px;
        }

        #status {
            color: #00d9ff;
            font-size: 20px;
            margin: 20px 0;
        }

        #heard {
            min-height: 30px;
            color: #ddd;
            font-size: 18px;
            margin: 15px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 25px;
            margin: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #00d9ff;
            color: #02101a;
        }

        button:hover {
            background: #65eaff;
        }

        #stopBtn {
            background: #ff5252;
            color: white;
        }

        .orb {
            width: 130px;
            height: 130px;
            margin: 20px auto;
            border-radius: 50%;
            border: 3px solid #00d9ff;
            box-shadow:
                0 0 20px #00d9ff,
                0 0 50px rgba(0, 217, 255, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="jarvis">

    <div class="orb"></div>

    <h1>JARVIS</h1>

    <p id="status">
        Jarvis शुरू करने के लिए Start दबाएँ।
    </p>

    <p id="heard">
        आपने अभी कुछ नहीं कहा।
    </p>

    <button id="startBtn" onclick="startJarvis()">
        🎙️ Start Jarvis
    </button>

    <button id="stopBtn" onclick="stopJarvis()">
        ⛔ Stop
    </button>

    <button onclick="testVoice()">
        🔊 Test Voice
    </button>

</div>


<script>

    let recognition;
    let isListening = false;
    let restarting = false;

    const statusText = document.getElementById("status");
    const heardText = document.getElementById("heard");


    // =========================
    // JARVIS SPEAK
    // =========================

    function speak(text) {

        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "hi-IN";
        speech.rate = 0.95;
        speech.pitch = 1;
        speech.volume = 1;

        speech.onstart = function () {
            statusText.innerText = "🔊 Jarvis बोल रहा है...";
        };

        speech.onend = function () {
            if (isListening) {
                statusText.innerText = "🎙️ Jarvis सुन रहा है...";
            }
        };

        speech.onerror = function (event) {
            console.log("Speech error:", event);
            statusText.innerText = "⚠️ Voice में समस्या हुई।";
        };

        window.speechSynthesis.speak(speech);
    }


    // =========================
    // TEST VOICE
    // =========================

    function testVoice() {

        speak(
            "Hello Boss. Jarvis online है। मेरी आवाज़ ठीक से काम कर रही है।"
        );
    }


    // =========================
    // START JARVIS
    // =========================

    function startJarvis() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {

            alert(
                "Speech Recognition उपलब्ध नहीं है। कृपया Google Chrome इस्तेमाल करें।"
            );

            return;
        }


        if (isListening) {
            return;
        }


        recognition = new SpeechRecognition();

        recognition.continuous = true;
        recognition.interimResults = false;

        // Hindi + English
        recognition.lang = "hi-IN";


        recognition.onstart = function () {

            isListening = true;

            statusText.innerText =
                "🎙️ Jarvis सुन रहा है... बोलिए!";

            document.getElementById("startBtn").style.display =
                "none";

            speak(
                "Jarvis online है। बोलिए Boss, मैं सुन रहा हूँ।"
            );
        };


        recognition.onresult = function (event) {

            const result =
                event.results[event.results.length - 1][0].transcript;

            const command =
                result.toLowerCase().trim();


            heardText.innerText =
                "आपने कहा: " + result;


            handleCommand(command);
        };


        recognition.onerror = function (event) {

            console.log(
                "Recognition error:",
                event.error
            );

            if (event.error === "not-allowed") {

                statusText.innerText =
                    "❌ Microphone permission बंद है।";

                alert(
                    "Chrome में Microphone permission Allow करें।"
                );

                isListening = false;

                return;
            }


            if (event.error === "no-speech") {

                statusText.innerText =
                    "🎙️ मैं सुन रहा हूँ...";

                return;
            }


            statusText.innerText =
                "⚠️ Mic error: " + event.error;
        };


        recognition.onend = function () {

            if (isListening && !restarting) {

                restarting = true;

                setTimeout(function () {

                    restarting = false;

                    try {
                        recognition.start();
                    }
                    catch (error) {
                        console.log(error);
                    }

                }, 500);
            }
        };


        try {

            recognition.start();

        } catch (error) {

            console.log(error);

            statusText.innerText =
                "❌ Jarvis शुरू नहीं हो पाया।";
        }
    }


    // =========================
    // STOP JARVIS
    // =========================

    function stopJarvis() {

        isListening = false;

        restarting = false;

        if (recognition) {

            try {
                recognition.stop();
            }
            catch (error) {
                console.log(error);
            }
        }

        window.speechSynthesis.cancel();

        statusText.innerText =
            "⛔ Jarvis बंद है।";

        document.getElementById("startBtn").style.display =
            "inline-block";
    }


    // =========================
    // COMMAND SYSTEM
    // =========================

    function handleCommand(command) {


        // HELLO

        if (
            command.includes("hello") ||
            command.includes("हेलो") ||
            command.includes("हैलो") ||
            command.includes("hi")
        ) {

            speak(
                "Hello Boss. बताइए, मैं आपकी क्या मदद कर सकता हूँ?"
            );

            return;
        }


        // HOW ARE YOU

        if (
            command.includes("कैसे हो") ||
            command.includes("how are you")
        ) {

            speak(
                "मैं बिल्कुल ठीक हूँ Boss. मैं आपकी मदद के लिए तैयार हूँ।"
            );

            return;
        }


        // NAME

        if (
            command.includes("तुम्हारा नाम") ||
            command.includes("your name")
        ) {

            speak(
                "मेरा नाम Jarvis है। मैं आपका personal voice assistant हूँ।"
            );

            return;
        }


        // TIME

        if (
            command.includes("समय") ||
            command.includes("टाइम") ||
            command.includes("time")
        ) {

            const now = new Date();

            const time =
                now.toLocaleTimeString(
                    "en-IN",
                    {
                        hour: "numeric",
                        minute: "2-digit"
                    }
                );

            speak(
                "अभी समय है " + time
            );

            return;
        }


        // DATE

        if (
            command.includes("आज की तारीख") ||
            command.includes("date") ||
            command.includes("तारीख")
        ) {

            const now = new Date();

            const date =
                now.toLocaleDateString(
                    "en-IN",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );

            speak(
                "आज की तारीख है " + date
            );

            return;
        }


        // OPEN GOOGLE

        if (
            command.includes("google खोलो") ||
            command.includes("google kholo") ||
            command.includes("open google")
        ) {

            speak("Google खोल रहा हूँ।");

            window.open(
                "https://www.google.com",
                "_blank"
            );

            return;
        }


        // OPEN YOUTUBE

        if (
            command.includes("youtube खोलो") ||
            command.includes("youtube kholo") ||
            command.includes("open youtube")
        ) {

            speak("YouTube खोल रहा हूँ।");

            window.open(
                "https://www.youtube.com",
                "_blank"
            );

            return;
        }


        // SEARCH GOOGLE

        if (
            command.startsWith("search ") ||
            command.startsWith("सर्च ")
        ) {

            let searchText =
                command
                    .replace("search ", "")
                    .replace("सर्च ", "")
                    .trim();


            if (searchText.length > 0) {

                speak(
                    searchText + " को Google पर खोज रहा हूँ।"
                );

                window.open(
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(searchText),
                    "_blank"
                );

                return;
            }
        }


        // STOP

        if (
            command.includes("jarvis बंद") ||
            command.includes("jarvis stop") ||
            command.includes("stop jarvis")
        ) {

            speak("ठीक है Boss. Jarvis बंद हो रहा है।");

            setTimeout(
                stopJarvis,
                1000
            );

            return;
        }


        // UNKNOWN COMMAND

        speak(
            "मैंने सुना: " +
            command +
            ". अभी यह command मेरे system में नहीं है।"
        );
    }

</script>

</body>
</html>
